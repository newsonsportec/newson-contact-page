<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Contact Us | Newson Sportec</title>

  <style>
    /* Remove default browser spacing */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Whole page */
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050705;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Main background */
    .page {
      min-height: 100vh;
      background:
        radial-gradient(circle at 75% 35%, rgba(157, 255, 0, 0.20), transparent 35%),
        linear-gradient(120deg, #030403 0%, #090c08 50%, #101908 100%);
      position: relative;
    }

    /* Subtle background grid */
    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(157, 255, 0, 0.05) 1px, transparent 1px),
        linear-gradient(rgba(157, 255, 0, 0.04) 1px, transparent 1px);
      background-size: 70px 70px;
      opacity: 0.15;
      pointer-events: none;
    }

    /* Top header */
    header {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 22px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.78);
      border-bottom: 1px solid rgba(160, 255, 30, 0.35);
      backdrop-filter: blur(8px);
      gap: 30px;
    }

    /*
      Logo box:
      This hides/crops the left edge of logo.png.
      It helps remove the white line on the left side.
    */
    .logo-box {
      width: 600px;
      max-width: 42vw;
      overflow: hidden;
      display: block;
    }

    /*
      Logo image:
      translateX(-8px) moves the logo slightly left,
      so the white line is hidden by the logo-box.
    */
    .logo {
      width: 610px;
      max-width: none;
      height: auto;
      display: block;
      transform: translateX(-8px);
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.95));
    }

    /* Top navigation menu */
    nav {
      display: flex;
      align-items: center;
      gap: 32px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    /*
      Menu words:
      Original was about 16px.
      16px x 1.6 = 25.6px.
      So this uses 26px.
    */
    nav a {
      color: #e8e8e8;
      text-decoration: none;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
      transition: 0.25s;
      white-space: nowrap;
    }

    nav a:hover {
      color: #a7ff16;
    }

    nav .active {
      color: #a7ff16;
      padding: 14px 28px;
      border: 1px solid #a7ff16;
      border-radius: 30px;
      box-shadow: 0 0 18px rgba(167, 255, 22, 0.55);
    }

    /* Main contact area */
    .main-section {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 45px;
      padding: 45px 6% 30px;
      align-items: center;
    }

    /* Left contact area */
    .left-side {
      max-width: 1000px;
    }

    /*
      Social media icon area:
      This is placed between logo/header and contactus.png.
    */
    .social-area {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }

    .social-title {
      color: #a7ff16;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-right: 10px;
    }

    /*
      Social media icons:
      Original size was 56px.
      Now x2 bigger = 112px.
    */
    .social-icon {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.78);
      border: 2px solid #a7ff16;
      color: #a7ff16;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 42px;
      font-weight: 900;
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.95);
      transition: 0.25s;
    }

    .social-icon:hover {
      background: #a7ff16;
      color: #050705;
      transform: translateY(-4px) scale(1.08);
    }

    /*
      Contact Us image
      x1.8 bigger
    */
    .contact-title-img {
      width: 1170px;
      max-width: 100%;
      margin-bottom: 24px;
      display: block;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.95));
    }

    /* Contact form */
    .contact-form {
      width: 100%;
    }

    .field {
      width: 100%;
      margin-bottom: 16px;
    }

    .field input,
    .field textarea {
      width: 100%;
      background: rgba(13, 15, 13, 0.9);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 14px;
      padding: 20px 22px;
      font-size: 18px;
      outline: none;
      transition: 0.25s ease;
      box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.55);
    }

    .field textarea {
      height: 170px;
      resize: vertical;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: #aaaaaa;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: #a7ff16;
      box-shadow:
        0 0 12px rgba(0, 0, 0, 0.95),
        inset 0 0 18px rgba(0, 0, 0, 0.55);
    }

    /*
      Send Message image button
      x1.8 bigger
      No green glow, only black shadow.
    */
    .send-btn {
      width: 774px;
      max-width: 100%;
      border: none;
      background: transparent;
      cursor: pointer;
      margin-top: 6px;
      transition: 0.25s;
      display: block;
    }

    .send-btn img {
      width: 100%;
      display: block;
      filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.95));
    }

    .send-btn:hover {
      transform: translateY(-3px) scale(1.02);
    }

    /* Right side mascot area */
    .right-side {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /*
      Mascot image
      x1.8 bigger
      No green glow, only black shadow.
    */
    .mascot-card {
      width: 1134px;
      max-width: 100%;
      display: block;
      filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.95));
    }

    /* Bottom signs */
    .bottom-signs {
      position: relative;
      z-index: 3;
      width: 100%;
      padding: 10px 0 0;
      background: rgba(0, 0, 0, 0.78);
      border-top: 1px solid rgba(167, 255, 22, 0.25);
    }

    .bottom-signs img {
      width: 100%;
      display: block;
    }

    /* Bottom-right green email button */
    .floating-email {
      position: fixed;
      right: 28px;
      bottom: 28px;
      z-index: 999;
      background: #a7ff16;
      color: #050705;
      text-decoration: none;
      font-weight: 900;
      font-size: 17px;
      padding: 16px 24px;
      border-radius: 999px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.95);
      transition: 0.25s;
      border: 1px solid rgba(255, 255, 255, 0.4);
      cursor: pointer;
    }

    .floating-email:hover {
      transform: translateY(-3px) scale(1.05);
      background: #c5ff48;
    }

    /* Medium screen view */
    @media (max-width: 1300px) {
      nav a {
        font-size: 22px;
      }

      nav {
        gap: 22px;
      }

      .logo-box {
        width: 520px;
        max-width: 38vw;
      }

      .logo {
        width: 530px;
      }

      .social-icon {
        width: 92px;
        height: 92px;
        font-size: 34px;
      }
    }

    /* Tablet view */
    @media (max-width: 1000px) {
      header {
        flex-direction: column;
        gap: 20px;
      }

      nav {
        justify-content: center;
        gap: 18px;
      }

      nav a {
        font-size: 20px;
      }

      .main-section {
        grid-template-columns: 1fr;
        padding-top: 40px;
      }

      .right-side {
        margin-top: 20px;
      }

      .logo-box {
        width: 520px;
        max-width: 90vw;
      }

      .logo {
        width: 530px;
      }

      .contact-title-img {
        width: 100%;
      }

      .send-btn {
        width: 100%;
      }

      .mascot-card {
        width: 100%;
      }

      .social-area {
        justify-content: center;
      }

      .social-icon {
        width: 86px;
        height: 86px;
        font-size: 32px;
      }
    }

    /* Mobile view */
    @media (max-width: 600px) {
      nav a {
        font-size: 15px;
      }

      nav .active {
        padding: 9px 16px;
      }

      .social-title {
        width: 100%;
        text-align: center;
        margin-bottom: 6px;
        font-size: 20px;
      }

      .social-icon {
        width: 70px;
        height: 70px;
        font-size: 24px;
      }

      .field input,
      .field textarea {
        font-size: 16px;
        padding: 17px;
      }

      .floating-email {
        right: 18px;
        bottom: 18px;
        font-size: 15px;
        padding: 14px 18px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- Top logo and menu -->
    <header>

      <!-- Logo with cropped left side to hide white line -->
      <a class="logo-box" href="https://newsonsportec.wixsite.com/wheelparts">
        <img class="logo" src="logo.png" alt="Newson Sportec Logo">
      </a>

      <!-- Top-right menu links -->
      <nav>
        <a href="https://newsonsportec.wixsite.com/wheelparts">HOME</a>

        <a href="https://newsonsportec.wixsite.com/wheelparts/motorcycle">MOTORCYCLE</a>

        <a href="https://newsonsportec.wixsite.com/wheelparts/bicycle">BICYCLE</a>

        <a href="https://newsonsportec.wixsite.com/wheelparts/wheelchair">WHEELCHAIR</a>

        <a href="https://www.facebook.com/Newsonsportecnews">NEWS</a>

        <a class="active" href="https://newsonsportec.github.io/newson-contact-page/index2.html#">CONTACT US</a>
      </nav>
    </header>

    <!-- Main content -->
    <main class="main-section">

      <!-- Left side: social icons and contact form -->
      <section class="left-side">

        <!-- Social media icons between logo.png and contactus.png -->
        <div class="social-area">
          <span class="social-title">FOLLOW US</span>

          <a class="social-icon"
             href="https://www.facebook.com/Newsonsportecnews"
             target="_blank"
             title="Facebook">
            f
          </a>

          <a class="social-icon"
             href="https://www.linkedin.com/company/111531327/admin/dashboard/"
             target="_blank"
             title="LinkedIn">
            in
          </a>

          <a class="social-icon"
             href="https://www.instagram.com/newsonsportec"
             target="_blank"
             title="Instagram">
            IG
          </a>

          <a class="social-icon"
             href="https://www.youtube.com/NEWSONSPORTEC"
             target="_blank"
             title="YouTube">
            ▶
          </a>
        </div>

        <!-- Contact Us image -->
        <img class="contact-title-img" src="contactus.png" alt="Contact Us">

        <!-- Contact form -->
        <form id="contactForm" class="contact-form">

          <div class="field">
            <input id="name" type="text" placeholder="Name" required>
          </div>

          <div class="field">
            <input id="email" type="email" placeholder="Email" required>
          </div>

          <div class="field">
            <input id="subject" type="text" placeholder="Subject" required>
          </div>

          <div class="field">
            <textarea id="message" placeholder="Message" required></textarea>
          </div>

          <button class="send-btn" type="submit">
            <img src="sendmessage.png" alt="Send Message">
          </button>

        </form>
      </section>

      <!-- Right side: mascot and email information image -->
      <section class="right-side">
        <img class="mascot-card" src="mascot(1).png" alt="Newson Sportec Contact Information">
      </section>

    </main>

    <!-- Bottom signs -->
    <section class="bottom-signs">
      <img src="buttomsigns.png" alt="Premium Quality Precision Engineered Trusted By Riders">
    </section>

  </div>

  <!-- Bottom-right green email button -->
  <a id="floatingEmail" class="floating-email" href="mailto:newsonsportec@gmail.com">
    Send Email
  </a>

  <script>
    const businessEmail = "newsonsportec@gmail.com";

    function buildMailtoLink() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const subject = document.getElementById("subject").value.trim();
      const message = document.getElementById("message").value.trim();

      const finalSubject = subject || "New Contact Message";

      const body =
        "Name: " + name + "\n" +
        "Email: " + email + "\n\n" +
        "Message:\n" + message;

      return "mailto:" + businessEmail +
        "?subject=" + encodeURIComponent(finalSubject) +
        "&body=" + encodeURIComponent(body);
    }

    /*
      When users click the large Send Message image button,
      this opens their email app with their message filled in.
    */
    document.getElementById("contactForm").addEventListener("submit", function(event) {
      event.preventDefault();
      window.location.href = buildMailtoLink();
    });

    /*
      When users click the bottom-right green Send Email button,
      this also opens their email app with their message filled in.
    */
    document.getElementById("floatingEmail").addEventListener("click", function(event) {
      event.preventDefault();
      window.location.href = buildMailtoLink();
    });
  </script>

</body>
</html>
