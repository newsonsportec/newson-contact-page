<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Contact Us | Newson Sportec</title>

  <style>
    /* This removes default spacing from the browser */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Main website body */
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050705;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Whole page background */
    .page {
      min-height: 100vh;
      background:
        radial-gradient(circle at 75% 35%, rgba(157, 255, 0, 0.18), transparent 35%),
        linear-gradient(120deg, #030403 0%, #090c08 50%, #101908 100%);
      position: relative;
    }

    /* Soft background grid effect */
    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(157, 255, 0, 0.05) 1px, transparent 1px),
        linear-gradient(rgba(157, 255, 0, 0.04) 1px, transparent 1px);
      background-size: 70px 70px;
      opacity: 0.15;
      pointer-events: none;
    }

    /* Top menu bar */
    header {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 22px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.78);
      border-bottom: 1px solid rgba(160, 255, 30, 0.35);
      backdrop-filter: blur(8px);
    }

    /* logo.png - x3 bigger */
    .logo {
      width: 900px;
      max-width: 45vw;
      height: auto;
      display: block;

      /* black blur only */
      filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.9));
    }

    /* Navigation menu */
    nav {
      display: flex;
      align-items: center;
      gap: 34px;
      flex-wrap: wrap;
    }

    nav a {
      color: #e8e8e8;
      text-decoration: none;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;
      transition: 0.25s;
    }

    nav a:hover {
      color: #a7ff16;
    }

    nav .active {
      color: #a7ff16;
      padding: 12px 24px;
      border: 1px solid #a7ff16;
      border-radius: 30px;
      box-shadow: 0 0 18px rgba(167, 255, 22, 0.55);
    }

    /* Main two-column layout */
    .main-section {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 45px;
      padding: 55px 6% 30px;
      align-items: center;
    }

    /* Left contact form area */
    .left-side {
      max-width: 780px;
    }

    /* contactus.png title image */
    .contact-title-img {
      width: 650px;
      max-width: 100%;
      margin-bottom: 24px;
      display: block;
    }

    /* Contact form */
    .contact-form {
      width: 100%;
    }

    .field {
      width: 100%;
      margin-bottom: 16px;
    }

    /* Input boxes */
    .field input,
    .field textarea {
      width: 100%;
      background: rgba(13, 15, 13, 0.9);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 14px;
      padding: 20px 22px;
      font-size: 18px;
      outline: none;
      transition: 0.25s ease;
      box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.55);
    }

    .field textarea {
      height: 170px;
      resize: vertical;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: #aaaaaa;
    }

    /* Green border only when typing */
    .field input:focus,
    .field textarea:focus {
      border-color: #a7ff16;
      box-shadow:
        0 0 10px rgba(0, 0, 0, 0.9),
        inset 0 0 18px rgba(0, 0, 0, 0.55);
    }

    /* Send Message image button */
    .send-btn {
      width: 430px;
      max-width: 100%;
      border: none;
      background: transparent;
      cursor: pointer;
      margin-top: 6px;
      transition: 0.25s;
      display: block;
    }

    .send-btn img {
      width: 100%;
      display: block;

      /* black blur only, no green glow */
      filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.95));
    }

    .send-btn:hover {
      transform: translateY(-3px) scale(1.02);
    }

    /* Right mascot area */
    .right-side {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* mascot(1).png - x1.8 bigger */
    .mascot-card {
      width: 1134px;
      max-width: 100%;
      display: block;

      /* black blur only, no green glow */
      filter: drop-shadow(0 24px 34px rgba(0, 0, 0, 0.95));
    }

    /* Bottom signs image */
    .bottom-signs {
      position: relative;
      z-index: 3;
      width: 100%;
      padding: 10px 0 0;
      background: rgba(0, 0, 0, 0.78);
      border-top: 1px solid rgba(167, 255, 22, 0.25);
    }

    .bottom-signs img {
      width: 100%;
      display: block;
    }

    /* Bottom-right green email button */
    .floating-email {
      position: fixed;
      right: 28px;
      bottom: 28px;
      z-index: 999;
      background: #a7ff16;
      color: #050705;
      text-decoration: none;
      font-weight: 900;
      font-size: 17px;
      padding: 16px 24px;
      border-radius: 999px;
      box-shadow: 0 18px 28px rgba(0, 0, 0, 0.95);
      transition: 0.25s;
      border: 1px solid rgba(255, 255, 255, 0.4);
      cursor: pointer;
    }

    .floating-email:hover {
      transform: translateY(-3px) scale(1.05);
      background: #c5ff48;
    }

    /* Tablet screen */
    @media (max-width: 1000px) {
      header {
        flex-direction: column;
        gap: 20px;
      }

      nav {
        justify-content: center;
        gap: 18px;
      }

      .main-section {
        grid-template-columns: 1fr;
        padding-top: 40px;
      }

      .right-side {
        margin-top: 20px;
      }

      .logo {
        width: 700px;
        max-width: 90vw;
      }

      .mascot-card {
        width: 950px;
        max-width: 100%;
      }
    }

    /* Phone screen */
    @media (max-width: 600px) {
      nav a {
        font-size: 13px;
      }

      nav .active {
        padding: 9px 16px;
      }

      .field input,
      .field textarea {
        font-size: 16px;
        padding: 17px;
      }

      .logo {
        width: 520px;
        max-width: 95vw;
      }

      .mascot-card {
        width: 760px;
        max-width: 100%;
      }

      .floating-email {
        right: 18px;
        bottom: 18px;
        font-size: 15px;
        padding: 14px 18px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- Top logo and menu -->
    <header>
      <a href="index2.html">
        <img class="logo" src="logo.png" alt="Newson Sportec Logo">
      </a>

      <nav>
        <a href="index2.html">HOME</a>
        <a href="#">MOTORCYCLE</a>
        <a href="#">BICYCLE</a>
        <a href="#">WHEELCHAIR</a>
        <a href="#">NEWS</a>
        <a class="active" href="index2.html">CONTACT US</a>
      </nav>
    </header>

    <!-- Main content -->
    <main class="main-section">

      <!-- Left side: contact form -->
      <section class="left-side">
        <img class="contact-title-img" src="contactus.png" alt="Contact Us">

        <form id="contactForm" class="contact-form">

          <div class="field">
            <input id="name" type="text" placeholder="Name" required>
          </div>

          <div class="field">
            <input id="email" type="email" placeholder="Email" required>
          </div>

          <div class="field">
            <input id="subject" type="text" placeholder="Subject" required>
          </div>

          <div class="field">
            <textarea id="message" placeholder="Message" required></textarea>
          </div>

          <!-- This image is your green Send Message button -->
          <button class="send-btn" type="submit">
            <img src="sendmessage.png" alt="Send Message">
          </button>

        </form>
      </section>

      <!-- Right side: mascot contact image -->
      <section class="right-side">
        <img class="mascot-card" src="mascot(1).png" alt="Newson Sportec Contact Information">
      </section>

    </main>

    <!-- Bottom signs -->
    <section class="bottom-signs">
      <img src="buttomsigns.png" alt="Premium Quality Precision Engineered Trusted By Riders">
    </section>

  </div>

  <!-- Bottom-right email button -->
  <a id="floatingEmail" class="floating-email" href="mailto:newsonsportec@gmail.com">
    Send Email
  </a>

  <script>
    const businessEmail = "newsonsportec@gmail.com";

    function buildMailtoLink() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const subject = document.getElementById("subject").value.trim();
      const message = document.getElementById("message").value.trim();

      const finalSubject = subject || "New Contact Message";

      const body =
        "Name: " + name + "\n" +
        "Email: " + email + "\n\n" +
        "Message:\n" + message;

      return "mailto:" + businessEmail +
        "?subject=" + encodeURIComponent(finalSubject) +
        "&body=" + encodeURIComponent(body);
    }

    document.getElementById("contactForm").addEventListener("submit", function(event) {
      event.preventDefault();
      window.location.href = buildMailtoLink();
    });

    document.getElementById("floatingEmail").addEventListener("click", function(event) {
      event.preventDefault();
      window.location.href = buildMailtoLink();
    });
  </script>

</body>
</html>
